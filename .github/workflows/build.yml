name: Build Android AAB and APK with Obfuscation

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Workspace and Copy Sketchware Files
        run: |
          echo "Setting up workspace directories..."
          mkdir -p app/src/main/java app/src/main/res app/libs
          
          # کپی مستقیم و دقیق از مسیر واقعی پروژه شما در مخزن
          if [ -d "SW-Project/data/logic" ]; then
            cp -r SW-Project/data/logic/* app/src/main/java/ || true
            echo "Logic files copied successfully."
          fi

          if [ -d "SW-Project/data/view" ]; then
            cp -r SW-Project/data/view/* app/src/main/res/ || true
            echo "View files copied successfully."
          fi

          if [ -d "SW-Project/data/resource" ]; then
            cp -r SW-Project/data/resource/* app/src/main/res/ || true
            echo "Resource files copied successfully."
          fi

          if [ -d "SW-Project/data/library" ]; then
            cp -r SW-Project/data/library/* app/libs/ || true
            echo "Library files copied successfully."
          fi

          # ایجاد فایل build.gradle ریشه
          cat << 'EOF' > build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # ایجاد settings.gradle
          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          # ایجاد تنظیمات برنامه همراه با فعال‌سازی کامل مبهم‌سازی (Minify & ProGuard)
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              compileSdk 34
              defaultConfig {
                  applicationId "com.zalalapp.kakhasrar"
                  minSdk 21
                  targetSdk 34
                  versionCode 21
                  versionName "3.0"
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

          # ایجاد فایل قوانین پروگارد
          touch app/proguard-rules.pro

      - name: Build with Gradle
        run: |
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload Artifacts (AAB & APK)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Release-AAB-APK-Obfuscated
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
