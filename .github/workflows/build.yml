name: Build Android AAB and APK with Obfuscation

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Workspace and Locate Sketchware Files
        run: |
          echo "Searching for Sketchware project folders..."
          mkdir -p app/src/main/java app/src/main/res app/libs
          
          # پیدا کردن خودکار پوشه‌ها در هر عمقی از مخزن
          LOGIC_DIR=$(find . -type d -name "logic" | head -n 1)
          VIEW_DIR=$(find . -type d -name "view" | head -n 1)
          RES_DIR=$(find . -type d -name "resource" | head -n 1)
          LIB_DIR=$(find . -type d -name "library" | head -n 1)
          
          if [ -n "$LOGIC_DIR" ]; then cp -r "$LOGIC_DIR"/* app/src/main/java/ || true; fi
          if [ -n "$VIEW_DIR" ]; then cp -r "$VIEW_DIR"/* app/src/main/res/ || true; fi
          if [ -n "$RES_DIR" ]; then cp -r "$RES_DIR"/* app/src/main/res/ || true; fi
          if [ -n "$LIB_DIR" ]; then cp -r "$LIB_DIR"/* app/libs/ || true; fi

          # ایجاد فایل تنظیمات ریشه
          cat << 'EOF' > build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # ایجاد settings.gradle
          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          # ایجاد تنظیمات برنامه همراه با فعال‌سازی مبهم‌سازی (Minify & ProGuard)
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              compileSdk 34
              defaultConfig {
                  applicationId "com.zalalapp.kakhasrar"
                  minSdk 21
                  targetSdk 34
                  versionCode 21
                  versionName "3.0"
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

          # ایجاد فایل قوانین پروگارد
          touch app/proguard-rules.pro

      - name: Build with Gradle
        run: |
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload Artifacts (AAB & APK)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Release-AAB-APK-Obfuscated
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            **/build/outputs/**/*.aab
            **/build/outputs/**/*.apk
          if-no-files-found: warn
          retention-days: 14
